[package]
name = "krar_engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

# Native builds (iOS) play audio themselves through CoreAudio.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = "0.16"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "AudioContext",
  "AudioBuffer",
  "AudioBufferSourceNode",
  "AudioWorkletNode",
  "AudioWorkletNodeOptions",
  "AudioWorkletProcessor",
  "BaseAudioContext",
  "GainNode",
  "OscillatorNode",
  "PeriodicWave",
  "PeriodicWaveOptions",
] }

[profile.release]
opt-level = 3
lto = true
